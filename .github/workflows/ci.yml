name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: yarn install --immutable

      - name: Compile contracts
        run: yarn hardhat:compile

      - name: Lint frontend
        run: yarn next:lint --max-warnings=0

      - name: Lint contracts
        run: yarn hardhat:lint --max-warnings=0

      - name: Type check frontend
        run: yarn next:check-types

      - name: Type check contracts package
        run: yarn hardhat:check-types

      - name: Contract tests
        run: yarn hardhat:test

      - name: Frontend unit tests
        run: yarn next:test

      - name: Build frontend
        run: yarn next:build

      - name: README scripts exist
        run: node scripts/check-readme-scripts.mjs

      - name: template.json is valid
        run: node scripts/check-template-json.mjs

  property:
    name: Property tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: yarn install --immutable

      - name: Compile contracts
        run: yarn hardhat:compile

      - name: Property tests (200 sequences in CI, 1000 by default locally)
        run: yarn hardhat:test:property
        env:
          VERDICT_PROPERTY_RUNS: 200
          REPORT_GAS: false

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: yarn install --immutable

      - name: Coverage (summary printed, nothing uploaded)
        run: yarn hardhat:coverage

  slither:
    name: Slither
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: yarn install --immutable

      - name: Slither
        uses: crytic/slither-action@v0.4.0
        with:
          target: packages/hardhat
          slither-config: slither.config.json
          slither-args: --filter-paths "node_modules|mocks|spikes"
          fail-on: medium
          solc-version: 0.8.28
          node-version: 20.18.3

  e2e:
    name: Playwright routes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: yarn install --immutable

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: packages/nextjs

      - name: Build frontend
        run: yarn next:build

      - name: Routes in both themes at desktop and phone widths
        run: yarn next:test:e2e
        env:
          CI: true

  gitleaks:
    name: Secrets scan over full history
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
